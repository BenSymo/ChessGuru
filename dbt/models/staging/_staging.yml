version: 2

models:
  - name: stg_games
    description: Games with tidy types, a numeric score and the opponent's name hashed.
    columns:
      - name: game_uuid
        data_tests: [not_null]
      - name: outcome
        data_tests:
          - accepted_values:
              arguments:
                values: [win, draw, loss]
      - name: player_colour
        data_tests:
          - accepted_values:
              arguments:
                values: [white, black]
      - name: time_class
        data_tests:
          - accepted_values:
              arguments:
                values: [bullet, blitz, rapid, daily]

  - name: stg_moves
    columns:
      - name: ply
        data_tests: [not_null]
      - name: colour
        data_tests:
          - accepted_values:
              arguments:
                values: [white, black]

  - name: stg_move_evals
    description: Stockfish's verdict on each move, from the mover's point of view.
    columns:
      - name: label
        data_tests:
          - accepted_values:
              arguments:
                values: [best, good, inaccuracy, mistake, blunder]
      - name: phase
        data_tests:
          - accepted_values:
              arguments:
                values: [opening, middlegame, endgame]
      - name: mate_after
        description: "Positive: the mover can force mate. Negative: the mover is getting mated. 0: this move gave checkmate."

  - name: stg_game_analysis
    columns:
      - name: game_uuid
        data_tests: [not_null]
