version: 2

models:
  - name: fact_game
    description: "Grain: one row per game, from the analysed player's side."
    columns:
      - name: game_key
        data_tests: [unique, not_null]
      - name: game_uuid
        description: chess.com's own game ID, kept alongside the surrogate key.
        data_tests: [not_null]
      - name: time_control_key
        data_tests:
          - relationships:
              arguments: {to: ref('dim_time_control'), field: time_control_key}
      - name: opening_key
        data_tests:
          - relationships:
              arguments: {to: ref('dim_opening'), field: opening_key}
      - name: failed_to_convert
        description: The player reached a 75%+ chance to win (about +3) but did not win.
      - name: is_analysed
        description: Stockfish has analysed this game.

  - name: fact_move
    description: "Grain: one row per move (ply), both sides of the board."
    columns:
      - name: move_key
        data_tests: [unique, not_null]
      - name: game_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('fact_game'), field: game_key}

  - name: dim_time_control
    description: Each time control, with a readable label such as "3 min + 2s".
    columns:
      - name: time_control_key
        data_tests: [unique, not_null]

  - name: dim_opening
    description: Each opening, with its family (e.g. "Sicilian Defense").
    columns:
      - name: opening_key
        data_tests: [unique, not_null]
